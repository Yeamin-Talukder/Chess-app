<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%" height="200">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1F2937" />
    </linearGradient>
    <style>
      .title {
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        font-weight: 800;
        font-size: 36px;
        fill: #ffffff;
        letter-spacing: 3px;
        animation: pulseText 3s ease-in-out infinite;
      }
      .subtitle {
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        font-size: 14px;
        fill: #9CA3AF;
        letter-spacing: 5px;
        font-weight: 600;
      }
      .piece {
        transform-origin: center;
        animation: float 4s ease-in-out infinite;
      }
      .piece-delay {
        transform-origin: center;
        animation: float-reverse 4s ease-in-out infinite;
      }
      .grid-line {
        stroke: #2C3E50;
        stroke-width: 1;
        opacity: 0.2;
        animation: pulseGrid 4s ease-in-out infinite;
      }
      @keyframes float {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-10px) rotate(3deg); }
      }
      @keyframes float-reverse {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-10px) rotate(-3deg); }
      }
      @keyframes pulseText {
        0%, 100% { opacity: 0.95; }
        50% { opacity: 1; }
      }
      @keyframes pulseGrid {
        0%, 100% { opacity: 0.15; stroke: #2C3E50; }
        50% { opacity: 0.35; stroke: #2ECC71; }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bg-grad)" rx="16"/>

  <!-- Animated Grid -->
  <g>
    <path d="M 50,0 L 50,200 M 150,0 L 150,200 M 250,0 L 250,200 M 350,0 L 350,200 M 450,0 L 450,200 M 550,0 L 550,200 M 650,0 L 650,200 M 750,0 L 750,200" class="grid-line" />
    <path d="M 0,50 L 800,50 M 0,100 L 800,100 M 0,150 L 800,150" class="grid-line" />
  </g>

  <!-- Floating Pieces -->
  <!-- Left Side: Knight -->
  <g class="piece" transform="translate(60, 40) scale(1.6)">
    <text font-size="50" fill="#2ECC71" opacity="0.85">♞</text>
  </g>
  <!-- Right Side: Rook -->
  <g class="piece-delay" transform="translate(680, 40) scale(1.6)">
    <text font-size="50" fill="#2ECC71" opacity="0.85">♜</text>
  </g>

  <!-- Text Section -->
  <g transform="translate(400, 95)" text-anchor="middle">
    <text class="title" y="0">♟ MODERN ANDROID CHESS</text>
    <text class="subtitle" y="40">PREMIUM OFFLINE &amp; MULTIPLAYER GAME</text>
  </g>
</svg>
